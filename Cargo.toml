[workspace]
  members  = ["crates/*", "tools/xtask"]
  resolver = "3"

[workspace.package]
  authors      = ["Carlos Eduardo Ferreyra <jadu_015@ca.frre.utn.edu.ar>"]
  categories   = ["command-line-utilities", "development-tools"]
  description  = "Zero-config, language-agnostic CLI that turns any git repository into high-quality visual documentation."
  edition      = "2024"
  homepage     = "https://github.com/carlosferreyra/codetwin"
  keywords     = ["architecture", "cli", "docs", "documentation", "generator"]
  license      = "MIT"
  readme       = "README.md"
  repository   = "https://github.com/carlosferreyra/codetwin"
  rust-version = "1.93"
  version      = "0.2.0"

[workspace.dependencies]
  # Internal crates — referenced by other workspace members via `path`.
  codetwin          = { path = "crates/codetwin", version = "0.2.0" }
  codetwin-cli      = { path = "crates/codetwin-cli" }
  codetwin-config   = { path = "crates/codetwin-config" }
  codetwin-drivers  = { path = "crates/codetwin-drivers" }
  codetwin-ir       = { path = "crates/codetwin-ir" }
  codetwin-legacy   = { path = "crates/codetwin-legacy" }
  codetwin-pipeline = { path = "crates/codetwin-pipeline" }
  codetwin-render   = { path = "crates/codetwin-render" }

  # External crates — pinned once here, inherited by members via `workspace = true`.
  anyhow                = "1.0"
  cargo_metadata        = "0.23.1"
  clap                  = { version = "4.5", features = ["derive"] }
  glob                  = "0.3"
  ignore                = "0.4"
  notify-debouncer-mini = "0.4"
  petgraph              = "0.6"
  rayon                 = "1.7"
  serde                 = { version = "1.0", features = ["derive"] }
  serde_json            = "1.0"
  thiserror             = "1.0"
  toml                  = "0.8"
  toml_edit             = "0.25.17"
  tracing               = "0.1"
  tracing-subscriber    = { version = "0.3", features = ["env-filter"] }
  tree-sitter           = "0.20"
  tree-sitter-python    = "0.20"
  tree-sitter-rust      = "0.20"
  walkdir               = "2.4"

  # Dev-only.
  pretty_assertions = "1.4"
  tempfile          = "3.10"

[workspace.metadata.xtask]
  crate-prefix  = "codetwin"
  primary-crate = "codetwin"

[workspace.lints.rust]
  unsafe_code     = "forbid"
  unreachable_pub = "warn"
  missing_docs    = "warn"

[workspace.lints.clippy]
  pedantic                = { level = "warn", priority = -2 }
  missing_errors_doc      = "allow"
  missing_panics_doc      = "allow"
  module_name_repetitions = "allow"
  must_use_candidate      = "allow"
  too_many_lines          = "allow"

[profile.dev]
  debug     = true
  opt-level = 0

[profile.dev.package."*"]
  opt-level = 3

[profile.release]
  codegen-units = 1
  lto           = "fat"
  opt-level     = 3
  panic         = "abort"
  strip         = true

[profile.dist]
  inherits = "release"
